<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarea 3: Agenda Multicapas con CORS</title>
    <!-- Referencia limpia al archivo CSS dentro de su carpeta -->
    <link rel="stylesheet" href="css/estilo.css">
</head>
<body>

    <div class="container">
        <h1>Agenda Multicapas (CORS)</h1>

        <!-- Formulario de Entrada -->
        <form id="agenda-form">
            <div class="form-group">
                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre" placeholder="Ej. Juan Pérez">
            </div>
            <div class="form-group">
                <label for="email">Correo Electrónico:</label>
                <input type="email" id="email" placeholder="Ej. juan@correo.com">
            </div>
            <button type="submit">Guardar Contacto</button>
        </form>

        <!-- Listado / Capa de Visualización -->
        <div class="agenda-list">
            <h2>Contactos Sincronizados</h2>
            <ul id="items-container">
                <li>Cargando datos remotos...</li>
            </ul>
        </div>
    </div>

    <!-- Referencia limpia al archivo JS dentro de su carpeta -->
    <script src="js/app.js"></script>
</body>
</html>
